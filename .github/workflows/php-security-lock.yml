name: Generate targeted Vite security lock
on:
  pull_request:
    paths:
      - '.github/workflows/php-security-lock.yml'
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Generate only the Vite security patch lock
        working-directory: server
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-dev vite@8.2.4
          git checkout -- package.json
      - uses: actions/upload-artifact@v4
        with:
          name: targeted-security-npm-lock
          path: server/package-lock.json
          if-no-files-found: error
          retention-days: 1
