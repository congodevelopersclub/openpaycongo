name: Generate targeted Vite security lock
on:
  pull_request:
    paths:
      - '.github/workflows/php-security-lock.yml'
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Generate only the Vite security patch lock
        working-directory: server
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --volume "$PWD:/app" --workdir /app node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32 npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-dev vite@8.2.4
          git checkout -- package.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: targeted-security-npm-lock
          path: server/package-lock.json
          if-no-files-found: error
          retention-days: 1
