name: Generate targeted Symfony security lock
on:
  pull_request:
    paths:
      - '.github/workflows/php-security-lock.yml'
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Build repository PHP platform with required extensions
        run: docker build --target php83-platform-check --tag openpay-security-lock-runtime -f server/Dockerfile .
      - name: Generate only audited Symfony patches
        working-directory: server
        run: docker run --rm --user "$(id -u):$(id -g)" --env COMPOSER_HOME=/tmp/composer --volume "$PWD:/app" --workdir /app openpay-security-lock-runtime composer update symfony/http-foundation:7.4.21 symfony/yaml:7.4.18 --no-install --no-scripts --no-plugins --no-interaction --prefer-dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: targeted-security-composer-lock
          path: server/composer.lock
          if-no-files-found: error
          retention-days: 1
