name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Run canonical pull-request contract gate
        run: bash scripts/ci/fast-feedback.sh pr contracts

  laravel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Run canonical pull-request Laravel gate
        run: bash scripts/ci/fast-feedback.sh pr laravel

  postgres-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: openpaycongo
          POSTGRES_USER: openpay
          POSTGRES_PASSWORD: openpay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openpay -d openpaycongo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Run canonical pull-request PostgreSQL migration gate
        run: bash scripts/ci/fast-feedback.sh pr postgres-migration

  deposit-concurrency:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PostgreSQL 16
            image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
            connection: pgsql
            port: 5432
          - name: MySQL 8
            image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb # 8.4.11
            connection: mysql
            port: 3306
          - name: MariaDB 11
            image: mariadb:11.8@sha256:2439dcd7d14010ecd1ff7a4e1c5abe8e208c34fe35290744deeeaac3569043c3 # 11.8
            connection: mariadb
            port: 3306
    name: Deposit concurrency - ${{ matrix.name }}
    services:
      database:
        image: ${{ matrix.image }}
        env:
          POSTGRES_DB: openpaycongo
          POSTGRES_USER: openpay
          POSTGRES_PASSWORD: openpay
          MYSQL_DATABASE: openpaycongo
          MYSQL_USER: openpay
          MYSQL_PASSWORD: openpay
          MYSQL_ROOT_PASSWORD: root-openpay
          MARIADB_DATABASE: openpaycongo
          MARIADB_USER: openpay
          MARIADB_PASSWORD: openpay
          MARIADB_ROOT_PASSWORD: root-openpay
        ports:
          - 5432:5432
          - 3306:3306
        options: >-
          --health-cmd "pg_isready -U openpay -d openpaycongo || mysqladmin ping -h localhost -uroot -proot-openpay || healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Run canonical pull-request concurrency gate
        run: bash scripts/ci/fast-feedback.sh pr deposit-concurrency ${{ matrix.connection }} ${{ matrix.port }}

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Run canonical pull-request Flutter gate
        run: bash scripts/ci/fast-feedback.sh pr flutter
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openpaycongo-debug-apk-${{ github.sha }}
          path: android-client/build/ci/app-debug.apk
          if-no-files-found: error
          retention-days: 7
