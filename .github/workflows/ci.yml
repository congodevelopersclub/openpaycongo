name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate public contract and runtime-neutral fixtures in Docker
        run: docker build --target test -f docs/Dockerfile .

  laravel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Run canonical Laravel quality gates and tests in Docker
        run: docker build --target test -f server/Dockerfile .

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Analyze Flutter in Docker
        run: docker build --target analyze -f android-client/Dockerfile.ci android-client
      - name: Test Flutter in Docker
        run: docker build --target test -f android-client/Dockerfile.ci android-client
      - name: Build debug APK in Docker
        run: >-
          docker build --target artifact
          --output type=local,dest=android-client/build/ci
          -f android-client/Dockerfile.ci android-client
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openpaycongo-debug-apk-${{ github.sha }}
          path: android-client/build/ci/app-debug.apk
          if-no-files-found: error
          retention-days: 7
