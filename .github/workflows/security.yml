name: Security gate

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-fast:
    name: security-fast
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Run local secrets, dependency, PHP, authorization, and Dart checks
        run: bash ./scripts/security/security-fast.sh
      - name: Scan tracked Git history for secrets
        run: bash ./scripts/security/security-history.sh
      - name: Prove the secret scanner rejects a seeded failure
        run: bash ./scripts/security/verify-secret-scanner.sh
      - name: Prove dependency, PHP, authorization, and Dart controls reject seeded failures
        run: bash ./scripts/security/verify-enforced-controls.sh

  security-full:
    name: security-full
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Run full security gate and generate SBOM
        run: bash ./scripts/security/security-full.sh
      - name: Prove SBOM and container controls are enforced
        run: bash ./scripts/security/verify-full-controls.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: security-sbom-${{ github.sha }}
          path: artifacts/security/*.cdx.json
          if-no-files-found: error
          retention-days: 30
