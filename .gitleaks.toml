# Keep Gitleaks' built-in rules; this file adds only narrowly scoped exclusions.
[extend]
useDefault = true

# Public protocol vectors contain deterministic, non-production values that
# match Gitleaks' generic-key rule. These exact values are intentionally
# allowed; paths are never excluded, so changed or appended vector content is
# still scanned in both worktree and Git-history modes.
[allowlist]
description = "Exact deterministic public vector values"
regexTarget = "secret"
regexes = [
  '''^96cca119fadda9490c972d89459c944df15ba4c1afdad5806d9148ee99e73888$''',
  '''^9663aa1da97e848a914a436d04163dfbb89178f107f1b5b77ed3854203382854$''',
  '''^ZQcgbrXWTD1bjhYfpisscx_IkpKxBdpRYVaK3gc5Ypo$''',
  '''^zM3Oz9DR0tPU1dbX2Nna29zd3t_g4eLj5OXm5-jp6us$''',
  '''^AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8$''',
  '''^ICEiIyQlJicoKSorLC0uLzAxMjM0NTY3ODk6Ozw9Pj8$''',
  '''^QEFCQ0RFRkdISUpLTE1OT1BRUlNUVVZXWFlaW1xdXl8$''',
  '''^T6A6mKc3agbwQxUbvErlwQr0i2JdqvzNpkeoO50nsuo$''',
  '''^bT6HIGTInA6sc_RxP_u-3MKGpl96-emT_p387SQE7Jw$''',
]

[[rules]]
id = "security-gate-history-proof"
description = "Synthetic history-only secret used to prove Git-aware scanning"
regex = '''security_gate_history_[A-Za-z0-9]{32}'''
