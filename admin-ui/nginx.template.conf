server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  location = /ui-healthz {
    access_log off;
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    return 200 "ok\n";
  }

  location = /backend/healthz {
    include /etc/nginx/openpay-proxy.conf;
    proxy_pass ${BACKEND_ORIGIN}/healthz;
  }
  location = /backend/readyz {
    include /etc/nginx/openpay-proxy.conf;
    proxy_pass ${BACKEND_ORIGIN}/readyz;
  }
  location = /backend/version {
    include /etc/nginx/openpay-proxy.conf;
    proxy_pass ${BACKEND_ORIGIN}/version;
  }

  location = /healthz { return 404; }
  location = /readyz { return 404; }
  location = /version { return 404; }

  location /assets/ {
    include /etc/nginx/openpay-security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/openpay-security-headers.conf;
    add_header Cache-Control "no-store" always;
    try_files $uri $uri/ /index.html;
  }
}
