services:
  upstream:
    image: node:24.19.0-alpine@sha256:d32cdf619f63fe0471182d08996dd516c6275bb5fd31ae06e55a570bd9e1ad43
    working_dir: /test
    command: ["node", "fake-upstream.mjs"]
    volumes: ["./test:/test:ro"]
    network_mode: bridge
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9090/healthz').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 1s
      timeout: 1s
      retries: 20
      start_period: 1s
  admin:
    build: .
    environment: ["BACKEND_ORIGIN=http://upstream:9090"]
    depends_on:
      upstream:
        condition: service_healthy
    network_mode: bridge
    links: ["upstream:upstream"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/ui-healthz"]
      interval: 1s
      timeout: 1s
      retries: 20
  browser:
    build:
      context: .
      dockerfile: Dockerfile.browser-test
    depends_on:
      admin:
        condition: service_healthy
    network_mode: bridge
    links: ["admin:admin", "upstream:upstream"]
